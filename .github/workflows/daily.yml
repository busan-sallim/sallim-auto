name: 매일 카드뉴스 발행

on:
  # 저녁 8시 반 발행 (2026-10-30 사용자 요청: 아침 → 저녁 8시 반, 2주 시험 후 비교)
  # 주 신호: 20:28 클로드 예약 작업이 publish_now.txt 를 올려 바로 실행 (깃허브 예약은 늦거나 빠질 때가 많음)
  # 아래 예약은 대비용. 먼저 도는 한 번만 발행하고 나머지는 '오늘 이미 발행'이면 끝난다. (시간은 영국 기준 → 한국 +9시간)
  schedule:
    - cron: "47 11 * * *"   # 20:47
    - cron: "17 12 * * *"   # 21:17
    - cron: "47 12 * * *"   # 21:47
    - cron: "47 13 * * *"   # 22:47 (마지막 기회)
  push:                      # 아침 7시 클로드 예약 작업이 이 파일을 고쳐 올리면 바로 실행 (깃허브 예약 지연 대비 — 가장 확실한 방법)
    paths: ["publish_now.txt"]
  workflow_dispatch:         # 버튼으로 바로 실행하기
    inputs:
      dry_run:
        description: "미리보기만 (실제로 올리지 않기)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 준비물 설치
        run: pip install -r requirements.txt

      - name: 프리텐다드 글꼴 받기
        run: |
          curl -sSL -o /tmp/pretendard.zip https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip
          unzip -q -o /tmp/pretendard.zip -d /tmp/pretendard
          mkdir -p fonts
          for w in Black Bold Medium; do
            cp "$(find /tmp/pretendard -name "Pretendard-$w.otf" | head -1)" fonts/
          done
          ls fonts

      - name: 오늘 올릴 원고 고르기
        id: pick
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && python scripts/publish.py --published-today; then
            echo "오늘(한국 날짜)은 이미 발행했어요. 이번 예약 실행은 건너뜁니다."
            echo "stem=" >> "$GITHUB_OUTPUT"
            echo "done=1" >> "$GITHUB_OUTPUT"
          else
            echo "stem=$(python scripts/publish.py --pick)" >> "$GITHUB_OUTPUT"
          fi

      - name: 올릴 원고가 없을 때
        if: steps.pick.outputs.stem == '' && steps.pick.outputs.done != '1'
        run: echo "::warning::content 폴더에 남은 원고가 없어요. 새 원고를 넣어 주세요."

      - name: 미리보기
        if: steps.pick.outputs.stem != '' && inputs.dry_run
        run: |
          python scripts/render.py "content/${{ steps.pick.outputs.stem }}.json"
          python scripts/publish.py --dry-run

      - name: 미리보기 이미지 내려받기용으로 보관
        if: steps.pick.outputs.stem != '' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ steps.pick.outputs.stem }}
          path: out/${{ steps.pick.outputs.stem }}

      - name: 카드 이미지 만들어 올리기
        if: steps.pick.outputs.stem != '' && !inputs.dry_run
        run: |
          python scripts/render.py "content/${{ steps.pick.outputs.stem }}.json"
          git config user.name "sallim-bot"
          git config user.email "sallim-bot@users.noreply.github.com"
          git add out/
          git commit -m "카드 이미지: ${{ steps.pick.outputs.stem }}" || true
          git push

      - name: 인스타·스레드 발행
        if: steps.pick.outputs.stem != '' && !inputs.dry_run
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python scripts/publish.py

      - name: 발행 기록 저장
        if: always() && steps.pick.outputs.stem != '' && !inputs.dry_run
        run: |
          python scripts/build_links.py   # 프로필 링크 모음 페이지 갱신
          git add published.json docs/
          git commit -m "발행 기록: ${{ steps.pick.outputs.stem }}" || true
          git push

      - name: 검수 알림 (걸린 원고·경고가 있으면 실패 메일)
        if: always()
        run: |
          status=0
          if [ -f skipped.txt ]; then
            echo "::error::발행 전 검수에 걸려 건너뛴 원고가 있어요."
            cat skipped.txt; status=1
          fi
          if [ -f warnings.txt ]; then
            echo "::warning::발행은 했지만 확인할 점이 있어요."
            cat warnings.txt; status=1
          fi
          exit $status
