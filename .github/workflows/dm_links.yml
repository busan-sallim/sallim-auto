name: 댓글 → DM 자동 링크

on:
  # 시험 통과 뒤 자동 실행을 켤 자리 (15분마다)
  # schedule:
  #   - cron: "*/15 * * * *"
  push:
    paths: ["dm_now.txt"]   # 클로드가 첫 줄에 할 일(권한 확인 / 시험 발송 / 미리보기 / 실제 보내기)을 적어 올리면 실행
  workflow_dispatch:
    inputs:
      mode:
        description: "무엇을 할까요?"
        type: choice
        options:
          - 권한 확인
          - 시험 발송 (001_bath 댓글에 링크 모음 페이지 보내기)
          - 미리보기 (안 보냄)
          - 실제 보내기
        default: 권한 확인

permissions:
  contents: write

concurrency:
  group: dm-links
  cancel-in-progress: false

jobs:
  dm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 실행
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MODE: ${{ inputs.mode || '실제 보내기' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then MODE=$(head -1 dm_now.txt); fi
          echo "할 일: $MODE"
          case "$MODE" in
            "권한 확인") python scripts/dm_links.py --check ;;
            "진단")
              mkdir -p stats
              python scripts/dm_links.py --diag --test 001_bath 2>&1 | tee stats/dm_diag.txt
              git config user.name "sallim-bot"; git config user.email "sallim-bot@users.noreply.github.com"
              git add stats/dm_diag.txt; git commit -m "댓글→DM 진단 결과" || true; git pull --rebase -q && git push ;;
            "시험 발송"*) python scripts/dm_links.py --test 001_bath ;;
            "미리보기"*) python scripts/dm_links.py --dry-run ;;
            *) python scripts/dm_links.py ;;
          esac
